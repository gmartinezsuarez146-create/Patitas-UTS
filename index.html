<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patitas UTS | Acceso</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">
  <main class="auth-wrapper">
    <div class="card auth-card shadow">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <img src="img/logo.svg" class="auth-logo" alt="Logo de Patitas UTS">
          <h1 class="h3 fw-bold mt-2 mb-0">Patitas UTS</h1>
          <p class="text-muted mb-0">Fundación de adopción de mascotas</p>
        </div>

        <ul class="nav nav-pills nav-fill mb-4" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-login" type="button" role="tab">Iniciar sesión</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-registro" type="button" role="tab">Crear cuenta</button>
          </li>
        </ul>

        <div id="alertaAuth"></div>

        <div class="tab-content">
          <!-- LOGIN -->
          <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
            <form id="formLogin" novalidate>
              <div class="mb-3">
                <label for="loginUsuario" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="loginUsuario" autocomplete="username" required>
              </div>
              <div class="mb-4">
                <label for="loginPassword" class="form-label">Contraseña</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="loginPassword" autocomplete="current-password" required>
                  <button class="btn btn-outline-secondary" type="button" data-ver="loginPassword" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Ingresar</button>
            </form>
          </div>

          <!-- REGISTRO -->
          <div class="tab-pane fade" id="tab-registro" role="tabpanel">
            <form id="formRegistro" novalidate>
              <div class="mb-3">
                <label for="regNombre" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="regNombre" required minlength="3">
              </div>
              <div class="mb-3">
                <label for="regEmail" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="regEmail" required>
              </div>
              <div class="mb-3">
                <label for="regUsuario" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="regUsuario" required minlength="4" pattern="[a-zA-Z0-9_.]+">
                <div class="form-text">Mínimo 4 caracteres, sin espacios.</div>
              </div>
              <div class="row g-2 mb-4">
                <div class="col-sm-6">
                  <label for="regPassword" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="regPassword" required minlength="6" autocomplete="new-password">
                </div>
                <div class="col-sm-6">
                  <label for="regConfirmar" class="form-label">Confirmar</label>
                  <input type="password" class="form-control" id="regConfirmar" required minlength="6" autocomplete="new-password">
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Crear cuenta</button>
            </form>
          </div>
        </div>

        <p class="text-center text-muted small mt-4 mb-0">
          Cuentas de prueba: <strong>admin</strong> / admin123 y <strong>usuario</strong> / user123
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
